services:
  postgres:
    image: postgres:15-alpine
    container_name: fsl_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fantasysuperleague
    ports:
      # Host 5433 agar tidak tabrakan dengan Postgres native di 5432
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fantasysuperleague"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: fsl_backend
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      GIN_MODE: release
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: fantasysuperleague
      JWT_SECRET: fantasy_super_league_super_secret_key_change_me_in_prod_2024
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
